# Builds Strata and publishes it on GitHub Pages every time code lands on main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # the site lives at https://<you>.github.io/<repository name>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # filled in from Settings > Secrets and variables > Actions > Variables (see SETUP.md)
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # optional: film posters from TMDB instead of Wikipedia (see SETUP.md)
          NEXT_PUBLIC_TMDB_KEY: ${{ vars.TMDB_KEY }}
      # the private speech model is served from this site, so voice typing never talks to another server
      - run: scripts/get-voice-model.sh out/models
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
